<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniRoute Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-sidebar: #141414;
      --bg-input: #1a1a1a;
      --bg-hover: #222;
      --bg-active: #2a2a2a;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --text-muted: #888;
      --text-dim: #666;
      --accent: #d97757;
      --accent-soft: rgba(217, 119, 87, 0.15);
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
      --radius-sm: 8px;
      --font: "Inter", system-ui, -apple-system, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 15px; line-height: 1.5; overflow: hidden;
    }
    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    .app { display: flex; height: 100vh; width: 100vw; }

    .sidebar {
      width: 280px; min-width: 280px; background: var(--bg-sidebar);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      transition: width 0.2s ease;
    }
    .sidebar.collapsed { width: 0; min-width: 0; overflow: hidden; border: none; }
    .sidebar-header {
      padding: 16px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
    .logo-icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #d97757, #c45c3e);
      display: grid; place-items: center; font-size: 14px;
    }
    .btn-new {
      margin: 12px 12px 8px; display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: var(--radius-sm);
      background: var(--bg-hover); color: var(--text); font-weight: 500;
    }
    .btn-new:hover { background: var(--bg-active); }
    .chat-list { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
    .chat-list-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-dim); padding: 8px 10px 6px;
    }
    .chat-item {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer;
      font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-item:hover { background: var(--bg-hover); color: var(--text); }
    .chat-item.active { background: var(--bg-active); color: var(--text); }
    .chat-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .chat-item .delete { opacity: 0; color: var(--text-dim); padding: 2px; border-radius: 4px; flex-shrink: 0; }
    .chat-item:hover .delete { opacity: 1; }
    .chat-item .delete:hover { color: var(--danger); background: rgba(239, 68, 68, 0.12); }
    .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
    .settings-btn {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius-sm);
      color: var(--text-muted); font-size: 13.5px;
    }
    .settings-btn:hover { background: var(--bg-hover); color: var(--text); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
    .status-dot.ok { background: var(--success); box-shadow: 0 0 6px rgba(34, 197, 94, 0.5); }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    .topbar { height: 52px; display: flex; align-items: center; padding: 0 16px; gap: 12px; }
    .topbar-left { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      display: grid; place-items: center; color: var(--text-muted);
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
    .model-selector-wrap { position: relative; }
    .model-btn {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border-radius: var(--radius-sm); background: var(--bg-input);
      border: 1px solid var(--border); color: var(--text); font-weight: 500;
      font-size: 13.5px; max-width: 340px;
    }
    .model-btn:hover { border-color: #444; background: var(--bg-hover); }
    .model-btn .model-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-btn .chevron { color: var(--text-dim); flex-shrink: 0; }
    .model-dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; width: 380px; max-height: 460px;
      background: #1c1c1c; border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 16px 48px rgba(0,0,0,0.5); z-index: 50;
      display: none; flex-direction: column; overflow: hidden;
    }
    .model-dropdown.open { display: flex; }
    .model-add-row { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--border); }
    .model-add-row input {
      flex: 1; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); outline: none; color: var(--text); font-size: 13px;
    }
    .model-add-row input:focus { border-color: #555; }
    .model-add-row button {
      padding: 8px 14px; background: var(--text); color: var(--bg);
      border-radius: var(--radius-sm); font-weight: 500; font-size: 13px; white-space: nowrap;
    }
    .model-search { padding: 8px 10px 0; }
    .model-search input {
      width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); outline: none; color: var(--text); font-size: 13px;
    }
    .model-list { overflow-y: auto; flex: 1; padding: 6px; max-height: 280px; }
    .model-option {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: var(--radius-sm); cursor: pointer;
    }
    .model-option:hover { background: var(--bg-hover); }
    .model-option.selected { background: var(--accent-soft); }
    .model-option .name { flex: 1; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-option .remove { opacity: 0; color: var(--text-dim); padding: 2px; border-radius: 4px; flex-shrink: 0; }
    .model-option:hover .remove { opacity: 1; }
    .model-option .remove:hover { color: var(--danger); background: rgba(239, 68, 68, 0.12); }
    .model-option .check { color: var(--accent); flex-shrink: 0; opacity: 0; }
    .model-option.selected .check { opacity: 1; }
    .model-empty { padding: 20px 16px; text-align: center; color: var(--text-dim); font-size: 13px; }

    .messages { flex: 1; overflow-y: auto; padding: 24px 0 140px; }
    .messages-inner { max-width: 760px; margin: 0 auto; padding: 0 24px; }
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; text-align: center; padding: 40px 24px; min-height: 400px;
    }
    .greeting {
      font-family: var(--serif); font-size: 36px; font-weight: 400;
      letter-spacing: -0.02em; margin-bottom: 8px; color: var(--text);
    }
    .subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }
    .message { display: flex; gap: 14px; margin-bottom: 28px; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-size: 14px; font-weight: 600;
    }
    .avatar.user { background: #3b3b3b; color: #ccc; }
    .avatar.assistant { background: linear-gradient(135deg, #d97757, #c45c3e); color: #fff; }
    .message-body { flex: 1; min-width: 0; padding-top: 4px; }
    .message-role {
      font-size: 12px; font-weight: 600; color: var(--text-dim);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .message-content { color: var(--text); line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .message-content p { margin-bottom: 0.8em; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content pre {
      background: #1a1a1a; border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 14px 16px; overflow-x: auto; margin: 12px 0; font-size: 13px; line-height: 1.5;
    }
    .message-content code { font-family: "SF Mono", "Fira Code", "Consolas", monospace; font-size: 0.9em; }
    .message-content :not(pre) > code { background: #252525; padding: 2px 6px; border-radius: 4px; }
    .message-content ul, .message-content ol { margin: 0.6em 0; padding-left: 1.4em; }
    .message-content li { margin-bottom: 0.3em; }
    .message-content strong { font-weight: 600; }
    .message-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .msg-attach {
      display: flex; align-items: center; gap: 8px; background: var(--bg-hover);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 6px 10px; font-size: 12.5px; color: var(--text-muted); max-width: 220px;
    }
    .msg-attach img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
    .msg-attach .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .streaming-cursor {
      display: inline-block; width: 7px; height: 15px; background: var(--accent);
      margin-left: 1px; vertical-align: text-bottom; border-radius: 1px;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .error-msg {
      color: #f87171; background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25); border-radius: var(--radius-sm);
      padding: 12px 14px; font-size: 13.5px;
    }

    .input-area {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 0 24px 24px;
      background: linear-gradient(transparent, var(--bg) 30%); pointer-events: none;
    }
    .input-area > * { pointer-events: auto; }
    .input-box {
      max-width: 760px; margin: 0 auto; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .input-box:focus-within { border-color: #444; }
    .attach-preview { display: none; flex-wrap: wrap; gap: 8px; padding-bottom: 4px; }
    .attach-preview.has-files { display: flex; }
    .attach-chip {
      display: flex; align-items: center; gap: 8px; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 6px 8px 6px 6px; font-size: 12.5px; max-width: 200px;
    }
    .attach-chip img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .attach-chip .file-icon {
      width: 36px; height: 36px; border-radius: 6px; background: var(--bg-hover);
      display: grid; place-items: center; color: var(--text-muted); flex-shrink: 0;
    }
    .attach-chip .meta { flex: 1; min-width: 0; overflow: hidden; }
    .attach-chip .fname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .attach-chip .fsize { display: block; color: var(--text-dim); font-size: 11px; }
    .attach-chip .remove-attach {
      width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
      color: var(--text-dim); flex-shrink: 0;
    }
    .attach-chip .remove-attach:hover { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .input-box textarea {
      width: 100%; background: transparent; border: none; outline: none; resize: none;
      min-height: 24px; max-height: 180px; line-height: 1.5; color: var(--text);
    }
    .input-box textarea::placeholder { color: var(--text-dim); }
    .input-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .input-toolbar-left { display: flex; align-items: center; gap: 4px; color: var(--text-dim); font-size: 12.5px; }
    .attach-btn {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      display: grid; place-items: center; color: var(--text-muted);
    }
    .attach-btn:hover { background: var(--bg-hover); color: var(--text); }
    .model-hint { margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
    .send-btn {
      width: 34px; height: 34px; border-radius: 50%; background: var(--text); color: var(--bg);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .send-btn:not(:disabled):hover { transform: scale(1.05); }
    .send-btn.stop { background: var(--danger); color: #fff; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a1a1a; border: 1px solid var(--border); border-radius: 16px;
      width: 100%; max-width: 480px; padding: 28px; box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    .modal h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.02em; }
    .modal p { color: var(--text-muted); font-size: 13.5px; margin-bottom: 20px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
    .form-group input {
      width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); outline: none; color: var(--text);
    }
    .form-group input:focus { border-color: #555; }
    .form-group .hint { font-size: 12px; color: var(--text-dim); margin-top: 5px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn {
      flex: 1; padding: 11px 16px; border-radius: var(--radius-sm);
      font-weight: 500; font-size: 14px;
    }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: var(--bg-hover); color: var(--text); }
    .btn-secondary:hover { background: var(--bg-active); }
    .modal-status { font-size: 13px; margin-top: 12px; min-height: 20px; }
    .modal-status.ok { color: var(--success); }
    .modal-status.err { color: #f87171; }

    .drop-overlay {
      display: none; position: fixed; inset: 0; background: rgba(15, 15, 15, 0.85);
      z-index: 90; align-items: center; justify-content: center;
      border: 2px dashed var(--accent); pointer-events: none;
    }
    .drop-overlay.active { display: flex; }
    .drop-overlay span { font-size: 18px; font-weight: 500; color: var(--accent); }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    @media (max-width: 720px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 40; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar.collapsed { width: 280px; min-width: 280px; }
      .model-dropdown { width: min(380px, calc(100vw - 32px)); }
      .greeting { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="drop-overlay" id="dropOverlay"><span>Drop files to attach</span></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo"><div class="logo-icon">⚡</div><span>OmniRoute</span></div>
      </div>
      <button class="btn-new" id="btnNewChat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <div class="chat-list" id="chatList"><div class="chat-list-label">Chats</div></div>
      <div class="sidebar-footer">
        <button class="settings-btn" id="btnSettings">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Add API key</span>
        </button>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="btnToggleSidebar" title="Toggle sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="model-selector-wrap">
            <button class="model-btn" id="modelBtn">
              <span class="model-name" id="modelName">Add a model</span>
              <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="model-dropdown" id="modelDropdown">
              <div class="model-add-row">
                <input type="text" id="modelIdInput" placeholder="Model ID (e.g. cc/claude-opus-4-6)" autocomplete="off" />
                <button id="btnAddModel">Add</button>
              </div>
              <div class="model-search">
                <input type="text" id="modelSearch" placeholder="Search models..." autocomplete="off" />
              </div>
              <div class="model-list" id="modelList"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="messages" id="messages">
        <div class="messages-inner" id="messagesInner">
          <div class="empty-state" id="emptyState">
            <div class="greeting" id="greetingText">Hello</div>
            <div class="subtitle">How can I help you today?</div>
          </div>
        </div>
      </div>
      <div class="input-area">
        <div class="input-box">
          <div class="attach-preview" id="attachPreview"></div>
          <textarea id="userInput" rows="1" placeholder="Message OmniRoute..." autocomplete="off"></textarea>
          <div class="input-toolbar">
            <div class="input-toolbar-left">
              <button class="attach-btn" id="attachBtn" title="Attach files">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                </svg>
              </button>
              <input type="file" id="fileInput" multiple hidden />
              <span class="model-hint" id="modelHint">No model selected</span>
            </div>
            <button class="send-btn" id="sendBtn" disabled title="Send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>API Key</h2>
      <p>Enter your OmniRoute API key and base URL. Then add the model IDs you want to chat with.</p>
      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="Your OmniRoute API key" />
        <div class="hint">From OmniRoute dashboard → API Keys / Endpoints</div>
      </div>
      <div class="form-group">
        <label for="baseUrl">Base URL</label>
        <input type="text" id="baseUrl" placeholder="http://localhost:20128/v1" />
        <div class="hint">Usually ends with /v1</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancelSettings">Cancel</button>
        <button class="btn btn-primary" id="btnSaveSettings">Save</button>
      </div>
      <div class="modal-status" id="modalStatus"></div>
    </div>
  </div>
  <script>
  (function () {
    "use strict";
    const STORAGE_KEY = "omniroute-chat-v4";
    const MAX_FILE_SIZE = 20 * 1024 * 1024;
    // No files get their content dumped into the prompt — only images go as vision data.
    // Everything else is just a filename + size reference.

    let state = {
      baseUrl: "", apiKey: "", models: [], selectedModel: null,
      chats: [], activeChatId: null, streaming: false, abortController: null, pendingFiles: [],
    };
    let streamEl = null, streamCursor = null, pendingScroll = false;

    const $ = (id) => document.getElementById(id);
    const els = {
      sidebar: $("sidebar"), chatList: $("chatList"), statusDot: $("statusDot"), statusText: $("statusText"),
      modelBtn: $("modelBtn"), modelName: $("modelName"), modelDropdown: $("modelDropdown"),
      modelIdInput: $("modelIdInput"), modelSearch: $("modelSearch"), modelList: $("modelList"),
      messages: $("messages"), messagesInner: $("messagesInner"), emptyState: $("emptyState"),
      greetingText: $("greetingText"), userInput: $("userInput"), sendBtn: $("sendBtn"), modelHint: $("modelHint"),
      settingsModal: $("settingsModal"), baseUrl: $("baseUrl"), apiKey: $("apiKey"), modalStatus: $("modalStatus"),
      attachPreview: $("attachPreview"), attachBtn: $("attachBtn"), fileInput: $("fileInput"), dropOverlay: $("dropOverlay"),
    };

    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!s) return;
        state.baseUrl = s.baseUrl || ""; state.apiKey = s.apiKey || "";
        state.models = s.models || []; state.selectedModel = s.selectedModel || null;
        state.chats = s.chats || []; state.activeChatId = s.activeChatId || null;
      } catch (_) {}
    }
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          baseUrl: state.baseUrl, apiKey: state.apiKey, models: state.models,
          selectedModel: state.selectedModel, chats: state.chats, activeChatId: state.activeChatId,
        }));
      } catch (_) {}
    }

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function greeting() {
      const h = new Date().getHours();
      return h < 12 ? "Morning" : h < 17 ? "Afternoon" : "Evening";
    }
    function normalizeBaseUrl(url) {
      let u = (url || "").trim().replace(/\/+$/, "");
      if (!u) return "";
      if (!/^https?:\/\//i.test(u)) u = "http://" + u;
      return u;
    }
    function getActiveChat() { return state.chats.find((c) => c.id === state.activeChatId) || null; }
    function formatSize(b) {
      if (b < 1024) return b + " B";
      if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
      return (b / 1048576).toFixed(1) + " MB";
    }
    function getExt(n) { const i = n.lastIndexOf("."); return i >= 0 ? n.slice(i + 1).toLowerCase() : ""; }
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "&#39;"); }

    function renderMarkdown(text) {
      if (!text) return "";
      let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      html = html.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, c) => `<pre><code>${c.trim()}</code></pre>`);
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
      html = html.replace(/^\s*[-*]\s+(.+)$/gm, "<li>$1</li>");
      html = html.replace(/(<li>[\s\S]*?<\/li>)/g, (m) => m.startsWith("<ul>") ? m : "<ul>" + m + "</ul>");
      return html.split(/\n\n+/).map((p) => {
        if (p.startsWith("<pre>") || p.startsWith("<ul>")) return p;
        return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
      }).join("");
    }

    function readAsDataURL(file) {
      return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    }

    async function processFiles(fileList) {
      for (const file of Array.from(fileList || [])) {
        if (file.size > MAX_FILE_SIZE) { alert(`"${file.name}" is too large (max ${formatSize(MAX_FILE_SIZE)})`); continue; }
        if (state.pendingFiles.some((f) => f.name === file.name && f.size === file.size)) continue;
        const isImage = file.type.startsWith("image/");
        const entry = { id: uid(), file, name: file.name, size: file.size, isImage, isText: false, previewUrl: null, textContent: null, dataUrl: null };
        if (isImage) {
          entry.previewUrl = URL.createObjectURL(file);
          entry.dataUrl = await readAsDataURL(file);
        }
        state.pendingFiles.push(entry);
      }
      renderAttachPreview();
      updateSendEnabled();
    }
    function removePendingFile(id) {
      const i = state.pendingFiles.findIndex((f) => f.id === id);
      if (i < 0) return;
      if (state.pendingFiles[i].previewUrl) URL.revokeObjectURL(state.pendingFiles[i].previewUrl);
      state.pendingFiles.splice(i, 1);
      renderAttachPreview();
      updateSendEnabled();
    }
    function clearPendingFiles() {
      state.pendingFiles.forEach((f) => { if (f.previewUrl) URL.revokeObjectURL(f.previewUrl); });
      state.pendingFiles = [];
      renderAttachPreview();
    }
    function renderAttachPreview() {
      if (!state.pendingFiles.length) { els.attachPreview.classList.remove("has-files"); els.attachPreview.innerHTML = ""; return; }
      els.attachPreview.classList.add("has-files");
      els.attachPreview.innerHTML = state.pendingFiles.map((f) => {
        const thumb = f.isImage && f.previewUrl
          ? `<img src="${f.previewUrl}" alt="" />`
          : `<div class="file-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg></div>`;
        return `<div class="attach-chip">${thumb}<div class="meta"><span class="fname" title="${escapeAttr(f.name)}">${escapeHtml(f.name)}</span><span class="fsize">${formatSize(f.size)}</span></div><button class="remove-attach" data-id="${f.id}" title="Remove"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`;
      }).join("");
      els.attachPreview.querySelectorAll(".remove-attach").forEach((btn) => {
        btn.addEventListener("click", () => removePendingFile(btn.dataset.id));
      });
    }

    function buildMessageContent(text, files) {
      const hasImages = files.some((f) => f.isImage && f.dataUrl);
      const parts = [];
      if (text) parts.push(text);
      for (const f of files) {
        // Never include file contents — only a short reference (images are sent separately as vision)
        if (!f.isImage) parts.push(`\n\n[Attached file: ${f.name} (${formatSize(f.size)})]`);
      }
      const combined = parts.join("").trim() || (hasImages ? "" : "(empty)");
      if (!hasImages) return combined;
      const content = [];
      if (combined) content.push({ type: "text", text: combined });
      for (const f of files) {
        if (f.isImage && f.dataUrl) content.push({ type: "image_url", image_url: { url: f.dataUrl } });
      }
      return content;
    }

    // Fast streaming: only update text node, no full re-render
    function scheduleScroll() {
      if (pendingScroll) return;
      pendingScroll = true;
      requestAnimationFrame(() => {
        els.messages.scrollTop = els.messages.scrollHeight;
        pendingScroll = false;
      });
    }
    function updateStreamText(text) {
      if (!streamEl) return;
      const node = streamEl.firstChild;
      if (node && node.nodeType === Node.TEXT_NODE) node.nodeValue = text;
      else streamEl.insertBefore(document.createTextNode(text), streamCursor || null);
      scheduleScroll();
    }
    function finalizeStream(text, isError) {
      if (!streamEl) return;
      if (streamCursor) { streamCursor.remove(); streamCursor = null; }
      streamEl.innerHTML = isError
        ? `<div class="error-msg">${escapeHtml(text)}</div>`
        : renderMarkdown(text);
      streamEl = null;
    }

    async function streamChat(messages, model, onDelta, signal) {
      const base = normalizeBaseUrl(state.baseUrl);
      const res = await fetch(`${base}/chat/completions`, {
        method: "POST",
        headers: { Authorization: `Bearer ${state.apiKey}`, "Content-Type": "application/json" },
        body: JSON.stringify({ model, messages, stream: true, temperature: 0.7 }),
        signal,
      });
      if (!res.ok) {
        const t = await res.text().catch(() => "");
        throw new Error(`Chat error (${res.status}): ${t.slice(0, 300)}`);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "", full = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith("data:")) continue;
          const payload = trimmed.slice(5).trim();
          if (payload === "[DONE]") continue;
          try {
            const json = JSON.parse(payload);
            const delta = json.choices?.[0]?.delta?.content ?? json.choices?.[0]?.message?.content ?? "";
            if (delta) { full += delta; onDelta(full); }
          } catch (_) {}
        }
      }
      return full;
    }

    function updateConnectionStatus() {
      const hasKey = !!(state.baseUrl && state.apiKey);
      els.statusDot.className = "status-dot" + (hasKey ? " ok" : "");
      if (!hasKey) els.statusText.textContent = "Add API key";
      else if (!state.models.length) els.statusText.textContent = "API key set · add models";
      else els.statusText.textContent = state.models.length + " model" + (state.models.length === 1 ? "" : "s");
    }

    function renderModelList(filter) {
      const q = (filter || "").toLowerCase().trim();
      const list = state.models.filter((m) => !q || m.id.toLowerCase().includes(q));
      if (!list.length) {
        els.modelList.innerHTML = `<div class="model-empty">${state.models.length ? "No matching models" : "No models yet. Add a model ID above."}</div>`;
        return;
      }
      els.modelList.innerHTML = list.map((m) =>
        `<div class="model-option ${m.id === state.selectedModel ? "selected" : ""}" data-id="${escapeAttr(m.id)}">
          <span class="name" title="${escapeAttr(m.id)}">${escapeHtml(m.id)}</span>
          <button class="remove" data-id="${escapeAttr(m.id)}" title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
          <svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        </div>`
      ).join("");
      els.modelList.querySelectorAll(".model-option").forEach((el) => {
        el.addEventListener("click", (e) => {
          if (e.target.closest(".remove")) return;
          state.selectedModel = el.dataset.id;
          saveState(); updateModelUI();
          els.modelDropdown.classList.remove("open");
        });
      });
      els.modelList.querySelectorAll(".remove").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          state.models = state.models.filter((m) => m.id !== id);
          if (state.selectedModel === id) state.selectedModel = state.models[0]?.id || null;
          saveState(); updateModelUI(); updateConnectionStatus();
        });
      });
    }

    function updateModelUI() {
      els.modelName.textContent = state.selectedModel || "Add a model";
      els.modelHint.textContent = state.selectedModel || "No model selected";
      renderModelList(els.modelSearch.value);
      updateSendEnabled();
    }

    function renderChatList() {
      const items = state.chats.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).map((c) =>
        `<div class="chat-item ${c.id === state.activeChatId ? "active" : ""}" data-id="${c.id}">
          <span class="title">${escapeHtml(c.title || "New chat")}</span>
          <button class="delete" data-id="${c.id}" title="Delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
        </div>`
      ).join("");
      els.chatList.innerHTML = `<div class="chat-list-label">Chats</div>${items || '<div style="padding:12px;color:var(--text-dim);font-size:13px">No chats yet</div>'}`;
      els.chatList.querySelectorAll(".chat-item").forEach((el) => {
        el.addEventListener("click", (e) => {
          if (e.target.closest(".delete")) return;
          state.activeChatId = el.dataset.id;
          saveState(); renderChatList(); renderMessages();
        });
      });
      els.chatList.querySelectorAll(".delete").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          state.chats = state.chats.filter((c) => c.id !== id);
          if (state.activeChatId === id) state.activeChatId = state.chats[0]?.id || null;
          saveState(); renderChatList(); renderMessages();
        });
      });
    }

    function renderMessages() {
      const chat = getActiveChat();
      if (!chat || !chat.messages.length) {
        els.messagesInner.innerHTML = "";
        els.messagesInner.appendChild(els.emptyState);
        els.emptyState.style.display = "flex";
        els.greetingText.textContent = greeting();
        streamEl = null; streamCursor = null;
        return;
      }
      els.emptyState.style.display = "none";
      let html = "";
      chat.messages.forEach((m, idx) => {
        const isUser = m.role === "user";
        const isStreaming = idx === chat.messages.length - 1 && m.role === "assistant" && m.streaming;
        let attachHtml = "";
        if (m.attachments && m.attachments.length) {
          attachHtml = `<div class="message-attachments">` + m.attachments.map((a) => {
            if (a.isImage && a.previewUrl) return `<div class="msg-attach"><img src="${a.previewUrl}" alt="" /><span class="fname">${escapeHtml(a.name)}</span></div>`;
            return `<div class="msg-attach"><span class="fname">📎 ${escapeHtml(a.name)}</span></div>`;
          }).join("") + `</div>`;
        }
        let contentHtml = "";
        if (m.error) contentHtml = `<div class="error-msg">${escapeHtml(m.content || "")}</div>`;
        else if (!isStreaming) {
          const txt = typeof m.content === "string" ? m.content : (m.displayText || "");
          contentHtml = renderMarkdown(txt);
        }
        html += `<div class="message"><div class="avatar ${isUser ? "user" : "assistant"}">${isUser ? "U" : "✦"}</div><div class="message-body"><div class="message-role">${isUser ? "You" : "Assistant"}</div>${attachHtml}<div class="message-content" id="${isStreaming ? "streamTarget" : ""}">${contentHtml}</div></div></div>`;
      });
      els.messagesInner.innerHTML = html;
      streamEl = $("streamTarget");
      if (streamEl) {
        streamCursor = document.createElement("span");
        streamCursor.className = "streaming-cursor";
        streamEl.appendChild(document.createTextNode(""));
        streamEl.appendChild(streamCursor);
      } else streamCursor = null;
      scheduleScroll();
    }

    function updateSendEnabled() {
      const canSend = (els.userInput.value.trim() || state.pendingFiles.length) &&
        state.selectedModel && state.apiKey && state.baseUrl && !state.streaming;
      if (state.streaming) {
        els.sendBtn.classList.add("stop");
        els.sendBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>`;
        els.sendBtn.title = "Stop";
        els.sendBtn.disabled = false;
      } else {
        els.sendBtn.classList.remove("stop");
        els.sendBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
        els.sendBtn.title = "Send";
        els.sendBtn.disabled = !canSend;
      }
    }

    function newChat() {
      const chat = { id: uid(), title: "New chat", messages: [], createdAt: Date.now(), updatedAt: Date.now() };
      state.chats.unshift(chat);
      state.activeChatId = chat.id;
      saveState(); renderChatList(); renderMessages();
      els.userInput.focus();
    }
    function addModel() {
      const id = els.modelIdInput.value.trim();
      if (!id) return;
      if (!state.models.some((m) => m.id === id)) state.models.push({ id });
      state.selectedModel = id;
      els.modelIdInput.value = "";
      saveState(); updateModelUI(); updateConnectionStatus();
    }

    async function sendMessage() {
      if (state.streaming) { state.abortController?.abort(); return; }
      const text = els.userInput.value.trim();
      const files = state.pendingFiles.slice();
      if ((!text && !files.length) || !state.selectedModel || !state.apiKey || !state.baseUrl) return;

      let chat = getActiveChat();
      if (!chat) { newChat(); chat = getActiveChat(); }

      const content = buildMessageContent(text, files);
      const displayText = text || (files.length ? `(${files.length} file${files.length > 1 ? "s" : ""})` : "");
      const attachments = files.map((f) => ({ name: f.name, size: f.size, isImage: f.isImage, previewUrl: f.isImage ? f.dataUrl : null }));

      chat.messages.push({ role: "user", content, displayText, attachments });
      if (chat.title === "New chat") {
        const src = text || files[0]?.name || "New chat";
        chat.title = src.slice(0, 48) + (src.length > 48 ? "…" : "");
      }
      chat.updatedAt = Date.now();
      const assistantMsg = { role: "assistant", content: "", streaming: true };
      chat.messages.push(assistantMsg);

      els.userInput.value = "";
      clearPendingFiles();
      autoResize();
      saveState();
      renderChatList();
      renderMessages();

      state.streaming = true;
      state.abortController = new AbortController();
      updateSendEnabled();

      try {
        const apiMessages = chat.messages
          .filter((m) => m.role === "user" || (m.role === "assistant" && !m.error && m.content))
          .slice(0, -1)
          .map((m) => ({ role: m.role, content: m.content }));
        const full = await streamChat(apiMessages, state.selectedModel, (partial) => {
          assistantMsg.content = partial;
          updateStreamText(partial);
        }, state.abortController.signal);
        assistantMsg.content = full || assistantMsg.content;
        assistantMsg.streaming = false;
        finalizeStream(assistantMsg.content, false);
      } catch (err) {
        assistantMsg.streaming = false;
        if (err.name === "AbortError") {
          if (!assistantMsg.content) assistantMsg.content = "(stopped)";
          finalizeStream(assistantMsg.content, false);
        } else {
          assistantMsg.content = err.message || String(err);
          assistantMsg.error = true;
          finalizeStream(assistantMsg.content, true);
        }
      } finally {
        state.streaming = false;
        state.abortController = null;
        chat.updatedAt = Date.now();
        saveState();
        updateSendEnabled();
      }
    }

    function saveSettings() {
      const base = normalizeBaseUrl(els.baseUrl.value);
      const key = els.apiKey.value.trim();
      if (!key) { els.modalStatus.textContent = "API key is required"; els.modalStatus.className = "modal-status err"; return; }
      if (!base) { els.modalStatus.textContent = "Base URL is required"; els.modalStatus.className = "modal-status err"; return; }
      state.baseUrl = base; state.apiKey = key;
      saveState(); updateConnectionStatus();
      els.modalStatus.textContent = "Saved"; els.modalStatus.className = "modal-status ok";
      setTimeout(() => { els.settingsModal.classList.remove("open"); els.modalStatus.textContent = ""; }, 400);
    }
    function autoResize() {
      const ta = els.userInput;
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 180) + "px";
    }

    $("btnNewChat").addEventListener("click", newChat);
    $("btnSettings").addEventListener("click", () => {
      els.apiKey.value = state.apiKey || "";
      els.baseUrl.value = state.baseUrl || "http://localhost:20128/v1";
      els.modalStatus.textContent = "";
      els.settingsModal.classList.add("open");
      els.apiKey.focus();
    });
    $("btnCancelSettings").addEventListener("click", () => els.settingsModal.classList.remove("open"));
    $("btnSaveSettings").addEventListener("click", saveSettings);
    $("btnToggleSidebar").addEventListener("click", () => {
      els.sidebar.classList.toggle("collapsed");
      if (window.innerWidth <= 720) els.sidebar.classList.toggle("open");
    });
    $("btnAddModel").addEventListener("click", addModel);
    els.modelIdInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addModel(); } });
    els.modelBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      els.modelDropdown.classList.toggle("open");
      if (els.modelDropdown.classList.contains("open")) { els.modelSearch.value = ""; renderModelList(); els.modelIdInput.focus(); }
    });
    els.modelSearch.addEventListener("input", () => renderModelList(els.modelSearch.value));
    document.addEventListener("click", (e) => {
      if (!els.modelDropdown.contains(e.target) && e.target !== els.modelBtn) els.modelDropdown.classList.remove("open");
    });
    els.attachBtn.addEventListener("click", () => els.fileInput.click());
    els.fileInput.addEventListener("change", () => {
      if (els.fileInput.files?.length) { processFiles(els.fileInput.files); els.fileInput.value = ""; }
    });
    let dragCounter = 0;
    document.addEventListener("dragenter", (e) => { e.preventDefault(); dragCounter++; els.dropOverlay.classList.add("active"); });
    document.addEventListener("dragleave", (e) => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dragCounter = 0; els.dropOverlay.classList.remove("active"); } });
    document.addEventListener("dragover", (e) => e.preventDefault());
    document.addEventListener("drop", (e) => {
      e.preventDefault(); dragCounter = 0; els.dropOverlay.classList.remove("active");
      if (e.dataTransfer?.files?.length) processFiles(e.dataTransfer.files);
    });
    els.userInput.addEventListener("paste", (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      const files = [];
      for (const item of items) { if (item.kind === "file") { const f = item.getAsFile(); if (f) files.push(f); } }
      if (files.length) { e.preventDefault(); processFiles(files); }
    });
    els.userInput.addEventListener("input", () => { autoResize(); updateSendEnabled(); });
    els.userInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    els.sendBtn.addEventListener("click", sendMessage);
    els.settingsModal.addEventListener("click", (e) => { if (e.target === els.settingsModal) els.settingsModal.classList.remove("open"); });

    loadState();
    els.greetingText.textContent = greeting();
    updateConnectionStatus();
    updateModelUI();
    renderChatList();
    renderMessages();
    if (!state.apiKey || !state.baseUrl) {
      setTimeout(() => {
        els.apiKey.value = state.apiKey || "";
        els.baseUrl.value = state.baseUrl || "http://localhost:20128/v1";
        els.settingsModal.classList.add("open");
        els.apiKey.focus();
      }, 200);
    }
  })();
  </script>
</body>
</html>
